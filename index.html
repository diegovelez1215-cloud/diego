.bh-topup.spin{background:linear-gradient(135deg,#ffd60a,#ff9f0a);color:#1a1400}
.bh-topup:active{transform:scale(.98)}
/* Daily Fortune reel */
.fortune{position:relative;margin-top:14px;border-radius:18px;overflow:hidden;background:radial-gradient(120% 100% at 50% 0%,rgba(255,214,10,.18),rgba(0,0,0,.4));border:1px solid rgba(255,214,10,.35);padding:30px 16px 26px;text-align:center}
.ft-glow{position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(255,214,10,.0),rgba(255,159,10,.16),rgba(255,214,10,0));animation:ftspin 6s linear infinite;pointer-events:none}
@keyframes ftspin{to{transform:rotate(360deg)}}
.ft-num{position:relative;font-family:"Space Grotesk",sans-serif;font-size:46px;font-weight:900;letter-spacing:-1px;color:#ffd60a;font-variant-numeric:tabular-nums;text-shadow:0 2px 30px rgba(255,214,10,.5)}
.ft-num.ft-hit{animation:ftpop .5s var(--spring)}
@keyframes ftpop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.ft-sub{position:relative;font-size:11px;font-weight:800;color:var(--mut2);text-transform:uppercase;letter-spacing:1px;margin-top:6px}
/* John Pork — secret call */
.pork-call{position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;animation:porkIn .3s var(--ease)}
@keyframes porkIn{from{opacity:0}to{opacity:1}}
.pork-card{text-align:center;padding:30px 28px}
.pork-ava{font-size:96px;line-height:1;animation:porkRing .9s var(--ease) infinite}
@keyframes porkRing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.pork-name{font-family:"Space Grotesk",sans-serif;font-size:30px;font-weight:900;color:#fff;margin-top:14px}
.pork-sub{font-size:14px;color:var(--mut);margin-top:4px}
.pork-btns{display:flex;gap:18px;justify-content:center;margin-top:34px}
.pork-ans,.pork-dec{border:none;width:74px;height:74px;border-radius:50%;font-size:13px;font-weight:800;cursor:pointer;color:#fff}
.pork-ans{background:#30d158;color:#03110a;animation:porkPulse 1.1s var(--ease) infinite}
.pork-dec{background:#ff453a}
@keyframes porkPulse{0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}50%{box-shadow:0 0 0 16px rgba(48,209,88,0)}}
.promo.rescue{background:linear-gradient(115deg,rgba(48,209,88,.26),rgba(10,132,255,.14));border-color:var(--green);animation:rescuePulse 2s var(--ease) infinite}
@keyframes rescuePulse{0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,.25)}50%{box-shadow:0 0 0 6px rgba(48,209,88,0)}}
.msn-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.msn-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:900;color:var(--txt);margin-bottom:9px}
.msn-h b{color:var(--gold);font-variant-numeric:tabular-nums}
.msn-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.msn-row.done{opacity:.62}
.msn-ic{font-size:17px;width:22px;text-align:center}
.msn-tx{flex:1;min-width:0}
.msn-t{font-size:12px;font-weight:700;color:var(--txt)}
.msn-bar{height:5px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:4px;overflow:hidden}
.msn-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--teal2));border-radius:4px;transition:width .4s var(--ease)}
.msn-r{font-size:11.5px;font-weight:900;color:var(--green);white-space:nowrap}
.msn-row:not(.done) .msn-r{color:var(--mut2)}
.promo.boostp{background:linear-gradient(115deg,rgba(255,159,10,.20),rgba(255,55,95,.14));border-color:rgba(255,159,10,.4)}
.promo.boostp .promo-h s{color:var(--mut2);font-weight:700}
.promo.boostp .promo-h b{color:#ffcb3d}
.sgpp-wrap{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sgpp{background:linear-gradient(120deg,rgba(94,92,230,.14),rgba(10,132,255,.08));border:1px solid var(--line2);border-radius:13px;padding:11px 13px}
.sgpp-t{font-size:12.5px;font-weight:900;color:var(--txt)}
.sgpp-legs{display:flex;flex-direction:column;gap:2px;margin:6px 0 8px}
.sgpp-legs span{font-size:11px;color:var(--mut);font-weight:600}
.sgpp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sgpp-od{font-family:"Space Grotesk",sans-serif;font-size:17px;font-weight:900;color:var(--teal2);font-variant-numeric:tabular-nums}
.sgpp-add{border:none;background:linear-gradient(135deg,#5e5ce6,#0a84ff);color:#fff;font-size:12px;font-weight:800;padding:9px 14px;border-radius:10px;cursor:pointer}
.sgpp-add:active{transform:scale(.96)}
.brs-total{font-size:46px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:6px 0 12px}
.brs-total.g{color:var(--green)}.brs-total.r{color:var(--red)}
.brs-list{display:flex;flex-direction:column;gap:9px;max-height:48vh;overflow-y:auto}
.brs-row{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--mut3);border-radius:12px;padding:11px 13px;animation:brsIn .32s var(--ease) both}
.brs-row.win{border-left-color:var(--green)}.brs-row.lose{border-left-color:var(--red)}
@keyframes brsIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.brs-row.reveal,.brs-leg.reveal,.brs-total.reveal{opacity:0;animation:brsReveal .42s var(--spring) both}
@keyframes brsReveal{0%{opacity:0;transform:translateY(10px) scale(.96)}60%{opacity:1;transform:translateY(0) scale(1.02)}100%{opacity:1;transform:none}}
.brs-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brs-lbl{font-size:13px;font-weight:800;color:var(--txt)}
.brs-tag{font-size:10px;font-weight:900;letter-spacing:.6px;padding:2px 8px;border-radius:20px;background:var(--solid);color:var(--mut)}
.brs-tag.w{background:rgba(48,209,88,.18);color:var(--green)}.brs-tag.l{background:rgba(255,69,58,.16);color:var(--red)}
.brs-legs{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.brs-leg{font-size:11px;color:var(--mut);font-weight:600}.brs-leg.w{color:var(--green)}.brs-leg.l{color:var(--mut2);text-decoration:line-through}
.brs-net{margin-top:7px;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}.brs-net.g{color:var(--green)}.brs-net.r{color:var(--red)}
.sbox.ro{display:flex;align-items:center;justify-content:center;min-width:34px}
.pdraw.ro{opacity:.45;cursor:default;display:flex;align-items:center;justify-content:center;font-weight:800}
.tb-l .kick{font-size:9.5px;letter-spacing:3.4px;color:var(--mut2);font-weight:700;text-transform:uppercase}
.tb-l .brand{
  font-family:"Space Grotesk",-apple-system,sans-serif;font-weight:800;font-size:30px;letter-spacing:-1px;line-height:.92;
  color:#fff;text-shadow:0 1px 22px rgba(10,132,255,.30);margin-top:1px;
}
.tb-l .brand .g26{color:var(--gold);-webkit-text-fill-color:var(--gold);text-shadow:0 1px 22px rgba(255,214,10,.30)}

/* bankroll chip */
.bankroll{display:inline-flex;align-items:center;gap:8px;background:rgba(48,209,88,.12);border:1px solid rgba(48,209,88,.28);border-radius:30px;padding:7px 13px;box-shadow:var(--shadow-1)}
.bk-l{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut2);font-weight:800}
.bk-v{font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.bk-pnl{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px}
.bk-pnl.up{color:var(--green);background:rgba(48,209,88,.16)}
.bk-pnl.down{color:var(--red);background:rgba(255,69,58,.16)}
.bk-open{display:none}

/* ---- layout & screens --------------------------------------------- */
.wrap{max-width:760px;margin:0 auto;padding:8px 16px calc(98px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.on{display:block}
.screen,.subview{content-visibility:auto;contain-intrinsic-size:720px}
.screen.on,.subview.on{content-visibility:visible;contain-intrinsic-size:auto}
.screen.enter{animation:viewIn .36s var(--ease)}
.subview{display:none}.subview.on{display:block}

/* orchestrated home reveal */
.screen.enter #home>*{animation:cardUp .52s both var(--ease)}
.screen.enter #home>*:nth-child(1){animation-delay:.02s}
.screen.enter #home>*:nth-child(2){animation-delay:.07s}
.screen.enter #home>*:nth-child(3){animation-delay:.12s}
.screen.enter #home>*:nth-child(4){animation-delay:.17s}
.screen.enter #home>*:nth-child(5){animation-delay:.22s}
.screen.enter #home>*:nth-child(n+6){animation-delay:.27s}

/* ---- segmented control (iOS) -------------------------------------- */
.seg{position:relative;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:4px 38px 4px 4px;margin:16px 0 18px;backdrop-filter:blur(18px) saturate(160%);-webkit-overflow-scrolling:touch;box-shadow:inset -26px 0 28px -22px rgba(255,255,255,.72),0 10px 28px -24px rgba(0,0,0,.8)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-width:92px;padding:10px 12px;border:none;background:transparent;color:var(--mut);font-size:13px;font-weight:800;border-radius:13px;transition:.25s var(--ease);white-space:nowrap}
.seg button.on{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.10));color:#fff;box-shadow:0 6px 18px -12px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.18) inset}
.seg::after{content:"";position:sticky;right:0;align-self:stretch;width:34px;margin:-4px -38px -4px 4px;border-radius:0 16px 16px 0;background:linear-gradient(90deg,rgba(18,25,64,0),rgba(18,25,64,.94) 46%),radial-gradient(circle at 72% 50%,rgba(255,255,255,.85) 0 2px,transparent 3px),radial-gradient(circle at 88% 50%,rgba(255,255,255,.45) 0 2px,transparent 3px);pointer-events:none;animation:segHint 1.9s ease-in-out infinite}
@keyframes segHint{0%,100%{opacity:.42;transform:translateX(0)}50%{opacity:1;transform:translateX(3px)}}

/* ---- Play discovery: visible doors into deeper tournament surfaces --- */
.play-hero{position:relative;margin:4px 0 14px;padding:15px;border-radius:var(--r3);border:1px solid rgba(255,255,255,.10);background:linear-gradient(135deg,rgba(10,132,255,.18),rgba(21,224,192,.07) 46%,rgba(255,214,10,.07));box-shadow:var(--shadow-2);overflow:hidden;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.play-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 24%,rgba(255,255,255,.11) 50%,transparent 74%);transform:translateX(-120%);animation:goldSweep 7s ease-in-out infinite}
.ph-top{position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:12px}
.ph-k{font-size:9.5px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase;color:var(--teal2)}
.ph-h{font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:900;letter-spacing:-.4px;margin-top:2px}
.ph-s{font-size:11.5px;font-weight:700;color:var(--mut);margin-top:3px;line-height:1.35}
.ph-count{font-family:"Space Grotesk",sans-serif;font-size:28px;font-weight:900;color:var(--gold);line-height:1;text-align:right}.ph-count span{display:block;font-family:"Manrope",sans-serif;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--mut2);margin-top:4px}
.play-doors{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:8px}
.pdoor{position:relative;min-height:94px;text-align:left;border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:12px;background:rgba(255,255,255,.055);color:var(--txt);overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.18);transition:transform .18s var(--ease),border-color .18s}
.pdoor:active{transform:scale(.98)}.pdoor.host{background:linear-gradient(135deg,rgba(21,224,192,.16),rgba(255,255,255,.045));border-color:rgba(21,224,192,.32)}.pdoor.match{background:linear-gradient(135deg,rgba(255,214,10,.14),rgba(255,255,255,.045));border-color:rgba(255,214,10,.28)}
.pd-ico{font-size:22px;margin-bottom:10px}.pd-h{font-size:13px;font-weight:900;letter-spacing:-.1px}.pd-s{font-size:10.5px;font-weight:700;color:var(--mut2);margin-top:4px;line-height:1.25}.pd-go{position:absolute;right:10px;top:10px;color:var(--teal2);font-weight:900}
.venue-peek{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 15px}
.vpeek{position:relative;border:1px solid var(--hair);border-radius:14px;padding:12px;min-height:106px;overflow:hidden;background:var(--card);box-shadow:var(--shadow-1);cursor:pointer}
.vpeek svg{position:absolute;inset:0;width:100%;height:100%;opacity:.42}.vpeek::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,13,38,.08),rgba(8,13,38,.72))}
.vpeek .vp-in{position:relative;z-index:1}.vp-k{font-size:8.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--teal2)}.vp-h{font-size:13px;font-weight:900;margin-top:24px}.vp-s{font-size:10px;color:var(--mut);font-weight:800;margin-top:2px}
@media(max-width:560px){.play-doors{grid-template-columns:1fr}.pdoor{min-height:76px}.venue-peek{grid-template-columns:1fr}.ph-top{align-items:flex-start}.ph-count{font-size:22px}}

/* ---- bottom tab bar ------------------------------------------------ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;top:auto;z-index:80;display:flex;justify-content:space-around;
  padding:9px 6px calc(9px + env(safe-area-inset-bottom));
  background:rgba(10,10,12,.62);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.07);
}
.tabbar button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--mut2);font-size:10px;font-weight:600;padding:2px;transition:color .2s}
.tabbar button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;transition:transform .3s var(--spring)}
.tabbar button.on{color:var(--blue)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.06)}
.tabbar button.on::before{content:"";position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--blue);box-shadow:0 0 10px rgba(10,132,255,.8)}
.tabbar button[data-badge]::after{content:attr(data-badge);position:absolute;top:3px;right:18%;min-width:15px;height:15px;padding:0 4px;border-radius:999px;background:linear-gradient(135deg,#ff453a,#ff9f0a);color:#fff;font-size:9px;font-weight:900;line-height:15px;text-align:center;box-shadow:0 0 14px rgba(255,69,58,.55)}
.tabbar button[data-badge="live"]::after{content:"LIVE";min-width:28px;background:linear-gradient(135deg,#ff453a,#b91c1c);font-size:8px;letter-spacing:.4px}

/* ---- home metrics -------------------------------------------------- */
.metrics{display:flex;gap:10px;margin:8px 0 14px}
.metric{flex:1;text-align:center;padding:15px 6px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r3);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--shadow-1)}
.metric b{display:block;font-family:"Space Grotesk",sans-serif;font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.metric span{font-size:11px;color:var(--mut2);font-weight:600}
.metric.live b{color:var(--red)}

/* ---- home champion hero ------------------------------------------- */
.home-champ{padding:22px;border-radius:var(--r4);margin-bottom:14px;background:var(--card);border:1px solid var(--hair);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--shadow-2);position:relative;overflow:hidden}
.home-champ.lit{background:linear-gradient(135deg,rgba(255,214,10,.18),rgba(28,28,30,.55));border-color:rgba(255,214,10,.30)}
.home-champ.lit::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 34%,rgba(255,214,10,.22) 50%,transparent 66%);transform:translateX(-120%);animation:goldSweep 4.2s ease-in-out infinite}
@keyframes goldSweep{0%{transform:translateX(-120%)}58%,100%{transform:translateX(120%)}}
.hc-l{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mut2);font-weight:800;margin-bottom:9px}
.hc-team{font-family:"Space Grotesk",sans-serif;font-size:28px;font-weight:800;letter-spacing:-.6px}
.hc-team .fg{margin-right:9px}
.hc-ph{font-size:16px;color:var(--mut);font-weight:500}

/* ---- quick actions ------------------------------------------------- */
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.qbtn{padding:15px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--card);color:var(--txt);font-size:14px;font-weight:700;backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite);transition:.2s var(--ease);box-shadow:var(--shadow-1)}
.qbtn:active{transform:scale(.97)}
.qbtn.primary{grid-column:1/-1;background:linear-gradient(180deg,#1f93ff,#0a84ff);border:none;color:#fff;font-size:15px;box-shadow:0 8px 22px -6px rgba(10,132,255,.6),0 1px 0 rgba(255,255,255,.25) inset}
.qbtn.ghost{color:var(--mut)}

/* ---- power rankings / generic panel ------------------------------- */
.panel{background:var(--card);border:1px solid var(--hair);border-radius:var(--r3);padding:16px;margin-bottom:16px;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:var(--shadow-1)}
.pr-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.pr-h>span{font-size:17px;font-weight:800;letter-spacing:-.3px}
.pr-i{background:rgba(10,132,255,.14);border:1px solid rgba(10,132,255,.3);color:var(--blue);font-size:11px;font-weight:700;padding:6px 11px;border-radius:30px}
.pr-row{display:grid;grid-template-columns:20px 24px 1fr 84px 32px;align-items:center;gap:9px;padding:6px 0}
.pr-rk{color:var(--mut3);font-weight:800;font-size:12px}.pr-fl{font-size:18px}.pr-nm{font-weight:600;font-size:14px}
.pr-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.pr-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:4px}
.pr-v{text-align:right;font-family:"Space Grotesk",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold)}

/* rank-info sheet */
.rankinfo{font-size:14px;line-height:1.55;color:var(--mut)}
.rankinfo p{margin-bottom:14px}.rankinfo b{color:var(--txt)}
.ri-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px;color:var(--txt)}
.ri-row b{font-variant-numeric:tabular-nums}.ri-row b.g{color:var(--green)}.ri-row b.r{color:var(--red)}
.ri-foot{margin-top:14px;font-size:12.5px;color:var(--mut2)}

/* ---- betting hub --------------------------------------------------- */
.bet-head{background:linear-gradient(135deg,rgba(48,209,88,.14),rgba(28,28,30,.55));border-color:rgba(48,209,88,.26)}
.bh-l{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut2);font-weight:800}
.bh-v{font-family:"Space Grotesk",sans-serif;font-size:40px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 10px;letter-spacing:-1px}
.bh-row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--mut)}
.bsec{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut3);font-weight:800;margin:18px 4px 9px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r2);padding:13px 15px;margin-bottom:8px;backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite);transition:transform .15s var(--ease)}
.brow:active{transform:scale(.99)}
.br-tm{font-size:14px;font-weight:700}.br-v{color:var(--mut3);margin:0 4px;font-weight:600}
.br-od{font-size:12px;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.g{color:var(--green);font-weight:800}.r{color:var(--red);font-weight:800}.o{color:var(--gold);font-weight:800}

/* ---- results / fixtures feed -------------------------------------- */
.sub-h{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut3);font-weight:800;margin:20px 4px 10px;display:flex;align-items:center;gap:9px}
.off-badge{font-size:9px;font-weight:800;color:var(--green);background:rgba(48,209,88,.14);border-radius:20px;padding:3px 8px;letter-spacing:.5px}
.off-badge.sim{color:var(--blue);background:rgba(10,132,255,.14)}
.frow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px;backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite)}
.frow.up{cursor:pointer;transition:transform .15s var(--ease)}.frow.up:active{transform:scale(.99)}
.fmatch{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fmatch .sc{font-family:"Space Grotesk",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;margin:0 3px}
.fmatch .vsx{color:var(--mut3);margin:0 2px;font-weight:600}
.fmatch .fw{color:#fff;font-weight:800}
.fmeta{font-size:11px;color:var(--mut2);font-weight:600;text-align:right;white-space:nowrap}
.fdot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}

/* today's matchday strip */
.today-strip{background:linear-gradient(135deg,rgba(10,132,255,.10),rgba(48,209,88,.05));border:1px solid rgba(10,132,255,.22);border-radius:var(--r3);padding:14px 14px 8px;margin-bottom:4px;backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite);box-shadow:var(--shadow-1)}
.today-gm{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;transition:opacity .15s}
.today-gm:last-child{border-bottom:none;padding-bottom:2px}
.today-gm:active{opacity:.6}
.today-teams{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.today-right{text-align:right;min-width:80px}
.today-sc{font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;margin-bottom:2px}
.today-time{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:2px}
.t-badge{font-size:9px;font-weight:800;border-radius:20px;padding:2px 7px;letter-spacing:.5px;display:block;text-align:center}
.t-badge.off{color:var(--green);background:rgba(48,209,88,.14)}
.t-badge.up{color:var(--mut2);background:rgba(255,255,255,.06)}
.t-badge.sim{color:var(--blue);background:rgba(10,132,255,.14)}

/* ---- storylines ---------------------------------------------------- */
.storiesttl{font-size:10px;letter-spacing:1.6px;color:var(--mut3);font-weight:900;text-transform:uppercase;margin:2px 2px 9px}
.stories{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.story{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--hair);border-radius:var(--r2);padding:12px 14px 12px 16px;backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite);animation:viewIn .4s var(--ease);box-shadow:var(--shadow-1)}
.story::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:3px;background:var(--blue)}
.story.champ::before{background:var(--gold)}.story.death::before{background:var(--red)}
.story .si{font-size:20px;flex-shrink:0}
.story .sh{font-size:12.5px;font-weight:900;line-height:1.25}
.story .ss{font-size:10.5px;color:var(--mut);margin-top:3px}
.skull{font-size:14px;margin-left:5px}

/* ---- outright odds board ------------------------------------------ */
.oddsboard{margin-bottom:14px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r2);overflow:hidden;backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite);box-shadow:var(--shadow-1)}
.oddsboard summary{cursor:pointer;list-style:none;padding:14px 15px;font-size:12.5px;font-weight:800;color:var(--txt);display:flex;justify-content:space-between;align-items:center}
.oddsboard summary::-webkit-details-marker{display:none}
.oddsboard summary span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut3);font-weight:800}
.obwrap{max-height:340px;overflow-y:auto;border-top:1px solid rgba(255,255,255,.07)}
.obrow{display:grid;grid-template-columns:26px 26px 1fr auto auto;gap:9px;align-items:center;padding:8px 15px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12.5px}
.obrow:nth-child(-n+3){background:rgba(255,214,10,.05)}
.obrk{color:var(--mut3);font-weight:900;font-size:11px}.obfl{font-size:15px}.obnm{font-weight:700}
.obp{color:var(--mut);font-variant-numeric:tabular-nums;font-size:11px}
.obo{color:var(--blue);font-family:"Space Grotesk",sans-serif;font-weight:800;font-variant-numeric:tabular-nums}

/* ---- bracket challenge -------------------------------------------- */
.chal{margin-bottom:14px;background:linear-gradient(135deg,rgba(94,92,230,.18),rgba(28,28,30,.55));border:1px solid rgba(94,92,230,.34);border-radius:var(--r3);padding:15px;backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite);box-shadow:var(--shadow-1)}
.chal-h{font-size:12.5px;font-weight:900;color:#b6b3ff;margin-bottom:8px}
.chal-d{font-size:11.5px;color:var(--mut);margin-bottom:12px;line-height:1.45}
.chalbtn{width:100%;padding:13px;border-radius:var(--r1);border:1px solid var(--line2);background:var(--card);color:var(--txt);font-size:12.5px;font-weight:800;cursor:pointer;transition:transform .15s var(--ease)}
.chalbtn:active{transform:scale(.98)}
.chalbtn.go{background:linear-gradient(180deg,#1f93ff,#0a84ff);border:none;color:#fff;box-shadow:0 8px 20px -8px rgba(10,132,255,.6)}
.chalbtn.alt{background:rgba(255,69,58,.14);border-color:rgba(255,69,58,.3);color:var(--red)}
.chal-row{display:flex;gap:8px}.chal-row .chalbtn{flex:1}
.chal-score{font-size:13px;font-weight:800;margin-bottom:10px;color:var(--txt)}

/* ---- pundit quote -------------------------------------------------- */
.pundit{position:relative;margin-top:13px;background:var(--card);border:1px solid var(--hair);border-left:3px solid var(--blue);border-radius:var(--r1);padding:12px 14px;backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite)}
.pcat{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue);font-weight:900;margin-bottom:5px}
.pq{font-size:12.5px;font-style:italic;color:#dbe6f5;line-height:1.5}

/* ---- moneyline / slips / fatigue ---------------------------------- */
.mlblk,.slipwrap,.fatblk{margin-top:13px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r1);padding:12px 14px;backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite)}
.mlh{font-size:10px;font-weight:900;letter-spacing:.7px;color:var(--mut3);text-transform:uppercase;margin-bottom:9px}
.mlrow{display:flex;gap:8px}
.mlcell{flex:1;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:10px;padding:10px 4px}
.mlcell .mll{font-size:10.5px;color:var(--mut);font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlcell .mlo{font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
.mlcell .mlp{font-size:10px;color:var(--mut2);margin-top:2px}
.slipbtns{display:flex;gap:8px;margin-bottom:9px}
.slb{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--txt);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.slb.on{border-color:var(--blue);background:rgba(10,132,255,.16);color:var(--blue2)}
.slipgo{display:flex;gap:8px}
.slipgo input{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:10px;color:var(--txt);padding:10px 12px;font-size:13px;font-weight:700;-moz-appearance:textfield}
.slipgo input::-webkit-outer-spin-button,.slipgo input::-webkit-inner-spin-button{-webkit-appearance:none}
.slipgo .chalbtn{flex:0 0 auto;width:auto;padding:10px 16px}
.slip{margin-top:13px;border-radius:var(--r1);padding:12px 14px;font-size:12.5px;font-weight:800;border:1px solid var(--hair)}
.slip.live{background:rgba(255,214,10,.1);border-color:rgba(255,214,10,.3);color:var(--gold)}
.slip.win{background:rgba(48,209,88,.12);border-color:rgba(48,209,88,.3);color:var(--green)}
.slip.loss{background:rgba(255,69,58,.1);border-color:rgba(255,69,58,.3);color:var(--red)}
.meter{margin:7px 0}
.mlbl2{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:4px}
.mlbl2 b{font-variant-numeric:tabular-nums}
.mbar{height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:4px;transition:width .5s var(--ease)}

/* ---- in-play live -------------------------------------------------- */
.livewrap{margin-top:13px;background:linear-gradient(160deg,rgba(10,132,255,.10),rgba(28,28,30,.6));border:1px solid rgba(10,132,255,.3);border-radius:var(--r1);padding:13px 14px;backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite)}
.liveclock{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.lc-min{font-family:"Space Grotesk",sans-serif;font-size:24px;font-weight:800;color:var(--blue2);font-variant-numeric:tabular-nums}
.lc-ph{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:900}
.lc-sc{font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.evlist{display:flex;flex-direction:column;gap:5px}
.evrow{display:flex;gap:10px;align-items:center;font-size:12.5px;animation:viewIn .3s var(--ease)}
.evmin{color:var(--gold);font-weight:900;min-width:34px;font-variant-numeric:tabular-nums}
.evtxt{font-weight:700;color:#dbe6f5}
.evnone{font-size:11.5px;color:var(--mut2);font-style:italic}

/* ---- scorecard ----------------------------------------------------- */
.scard{text-align:center;padding:4px 2px}
.sctop{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);font-weight:900;margin-bottom:6px}
.scbig{font-family:"Space Grotesk",sans-serif;font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.scbig span{font-size:22px;color:var(--mut2);font-weight:800;margin-left:6px}
.sctier{font-size:15px;font-weight:900;margin:8px 0 16px}
.scgrid{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;text-align:left}
.scrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:10px;padding:10px 13px}
.scl{font-size:12px;font-weight:700;color:var(--mut)}
.scv{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}.scv b{color:#fff}
.scp{font-size:12px;font-weight:900;color:var(--blue2);min-width:40px;text-align:right}
.scchamp{display:flex;gap:10px;margin-bottom:14px}
.scchamp>div{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:11px;padding:11px}
.scchamp .scl{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
.scfl{font-size:14px;font-weight:900}

/* ---- legacy engine controls (kept light) -------------------------- */
.enginebar{display:flex;align-items:center;gap:9px;padding:6px 2px 2px;flex-wrap:wrap}
.sbtn{padding:8px 14px;border-radius:24px;border:1px solid var(--line2);background:var(--card);color:var(--txt);font-size:11px;font-weight:800;cursor:pointer;backdrop-filter:var(--glass-lite)}
.sbtn.on{border-color:var(--blue);color:var(--blue2);box-shadow:var(--glow)}
.trackbar{display:inline-flex;align-items:center;gap:6px}
.trackbar .tt{display:inline-flex;align-items:center;gap:6px;background:rgba(10,132,255,.14);border:1px solid rgba(10,132,255,.34);color:var(--blue2);padding:5px 11px;border-radius:22px;cursor:pointer;font-size:11px;font-weight:900}
.trackbar .tx{cursor:pointer;color:var(--mut2);font-weight:900;font-size:13px;padding:2px 4px}

/* ---- toolbar buttons reused in sheets ----------------------------- */
.tbtn{border-radius:var(--r1)}
.tbtn.accent{background:linear-gradient(180deg,#1f93ff,#0a84ff);color:#fff;border:none;box-shadow:0 8px 20px -8px rgba(10,132,255,.6)}
.tbtn.purp{background:var(--purple);color:#fff;border:none}

/* ---- glassify core cards (groups/cities/bracket/etc.) ------------- */
.gcard,.ccard,.tie,.fcard,.pulse,.picker,.rhero,.share-box{
  background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:1px solid var(--hair);border-radius:var(--r3);box-shadow:var(--shadow-1)
}
.gcard:hover,.ccard:hover{border-color:var(--line2)}
.gcard.god{border-color:rgba(255,69,58,.4);box-shadow:0 0 26px -6px rgba(255,69,58,.3)}
.gbadge{background:linear-gradient(180deg,#1f93ff,#0a84ff);border-radius:12px;box-shadow:0 4px 12px -4px rgba(10,132,255,.6)}
.mrow{background:rgba(28,28,30,.5);border:1px solid var(--hair);border-radius:var(--r2);backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite)}
.mrow.foc{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 0 20px -6px rgba(10,132,255,.5)}
.mrow.ko{border-color:rgba(94,92,230,.34)}
.tie.path{border-color:var(--blue);box-shadow:0 0 18px -4px rgba(10,132,255,.45)}
.pill{background:rgba(28,28,30,.5);border:1px solid var(--hair);border-radius:30px}
.pe,.regttl{color:var(--mut2)}
.champ{background:linear-gradient(120deg,rgba(255,214,10,.14),rgba(28,28,30,.5));border:1px solid rgba(255,214,10,.28)}

/* ---- bottom sheet (cinematic) ------------------------------------- */
.sheet{
  background:rgba(20,20,22,.82);backdrop-filter:blur(36px) saturate(185%);-webkit-backdrop-filter:blur(36px) saturate(185%);
  border:1px solid var(--line2);border-bottom:none;border-radius:var(--r4) var(--r4) 0 0;-webkit-overflow-scrolling:touch;
  box-shadow:0 -20px 60px -20px rgba(0,0,0,.8)
}
.sheet-x{
  position:fixed;z-index:210;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);width:34px;height:34px;border-radius:50%;
  background:rgba(60,60,67,.85);border:1px solid var(--line2);color:#fff;font-size:15px;font-weight:700;display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(0,0,0,.5)
}
.scrim.on .sheet-x{display:flex}

/* ---- stadium banner art ------------------------------------------- */
.cbanner{position:relative;overflow:hidden}
.stage{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.cbanner .ct,.cbanner .cmeta{position:relative;z-index:2}
.cbanner .ct{padding-top:74px}

/* ---- toast --------------------------------------------------------- */
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}

/* ---- footer -------------------------------------------------------- */
footer{font-size:12px;color:var(--mut3)}
.obet{position:relative;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:14px;padding:0;margin-bottom:10px;overflow:hidden}
.fut-prog{font-size:11px;color:var(--mut);font-weight:700;margin:-4px 4px 10px;padding-left:2px}
.obet-actions{display:flex;gap:7px;padding:0 10px 10px;flex-wrap:wrap}
.cashbtn{position:static;transform:none;padding:8px 12px;border:1px solid rgba(48,209,88,.4);border-radius:10px;background:rgba(48,209,88,.14);color:var(--green);font-size:11px;font-weight:900;flex:1 1 92px;min-width:0}
.cashbtn:active{transform:scale(.96)}
.ttc{background:linear-gradient(135deg,rgba(94,92,230,.18),rgba(10,132,255,.1));border:1px solid rgba(94,92,230,.34);border-radius:var(--r2);padding:13px 15px;margin:0 14px 12px;cursor:pointer}
.ttc-h{font-size:10px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:#b6b3ff;margin-bottom:10px}
.ttc-g{display:flex;gap:8px}.ttc-g>div{flex:1;text-align:center}
.ttc-g b{display:block;font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:800;color:#fff}
.ttc-g span{font-size:10px;color:var(--mut2);font-weight:600}
.cele{text-align:center;padding:6px 2px 4px}

@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
.cele-lbl{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:800;margin-top:8px}
.cele-champ{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 4px}
.cele-fl{font-size:46px}
.cele-nm{font-family:"Space Grotesk",sans-serif;font-size:30px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(120deg,#ffe79a,#ffd60a 55%,#ff9f0a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cele-sub{font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:14px}
.cele-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ce-c{background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:12px;padding:11px}
.ce-c span{display:block;font-size:10px;color:var(--mut2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.ce-c b{font-size:13.5px;font-weight:800}
.cele-path{text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:12px;padding:6px 14px;margin-bottom:6px}
.cele-ph{font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:var(--mut2);padding:9px 0 6px;border-bottom:1px solid rgba(255,255,255,.06)}
.cele-pr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12.5px}
.cele-pr:last-child{border-bottom:none}.cele-pr span{color:var(--mut2);font-weight:600}.cele-pr b{font-weight:700}
.st-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.st-row:last-child{border-bottom:none}.st-row span{color:var(--mut2);font-weight:600}.st-row b{font-weight:800;font-variant-numeric:tabular-nums}
/* ===== stage 3 styling ===== */
.slipfab{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:75;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:18px;background:linear-gradient(135deg,rgba(31,147,255,.96),rgba(10,132,255,.88) 48%,rgba(21,224,192,.88));color:#fff;font-weight:800;font-size:13px;box-shadow:0 18px 44px -18px rgba(10,132,255,.9),0 1px 0 rgba(255,255,255,.25) inset;border:1px solid rgba(255,255,255,.18);cursor:pointer;animation:fabPop .3s var(--spring);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);max-width:620px;margin:0 auto}
@keyframes fabPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.todayfab{position:fixed;left:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:74;display:flex;align-items:center;gap:6px;padding:11px 16px;border-radius:30px;background:linear-gradient(135deg,#30d158,#0a84ff);color:#03110a;font-weight:900;font-size:13px;border:none;box-shadow:0 10px 26px -8px rgba(48,209,88,.7),0 1px 0 rgba(255,255,255,.25) inset;cursor:pointer;animation:fabPop .3s var(--spring)}
.todayfab:active{transform:scale(.94)}
.slipfab .sf-i{width:35px;height:35px;border-radius:12px;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}.slipfab .sf-n{background:rgba(255,255,255,.25);border-radius:20px;padding:1px 8px;font-variant-numeric:tabular-nums}.slipfab .sf-o{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.slip-legs{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}

.sl-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.sl-tx b{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sl-tx span{font-size:11px;color:var(--blue2);font-weight:800;font-variant-numeric:tabular-nums}
.sl-x{width:26px;height:26px;flex-shrink:0;border:none;border-radius:8px;background:rgba(255,69,58,.16);color:var(--red);font-weight:800;font-size:13px}
.tk-slip{width:100%;margin-top:9px;padding:13px;border-radius:14px;border:1px solid var(--line2);background:rgba(94,92,230,.16);color:#cfc9ff;font-size:13.5px;font-weight:800}
/* Parlay Lab risk/chance meter */

.lb-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.lb-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ffd60a,#ff9f0a);box-shadow:0 0 8px rgba(255,214,10,.4)}

/* live win prob */

/* ===== premium polish ===== */
.metric{position:relative;overflow:hidden}
.metric::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--teal2))}

.mrow,.frow,.brow,.moneyrow{transition:transform .15s var(--ease),border-color .15s}

.mkt{background:var(--card);border:1px solid var(--hair);border-radius:var(--r2);padding:4px 14px 8px;margin-bottom:8px;backdrop-filter:var(--glass-lite);-webkit-backdrop-filter:var(--glass-lite);box-shadow:var(--shadow-1)}

/* odds live-market badge */
.bmc-tagrow{padding:0 12px 8px;margin-top:-4px}
.liveodds-tag{display:inline-block;font-size:9px;font-weight:900;letter-spacing:.5px;color:var(--teal2);background:rgba(10,132,255,.14);border:1px solid rgba(10,132,255,.32);padding:2px 7px;border-radius:5px}
/* Top Performers (Athletic ratings) */
.perf-row{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.perf-top{display:flex;align-items:center;gap:9px}
.perf-rk{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:900;color:var(--mut3);min-width:18px;text-align:center}
.perf-fl{font-size:20px}.perf-nm{font-weight:800;font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.perf-ovr{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:900;color:var(--gold)}
.perf-bars{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.perf-stat{display:flex;align-items:center;gap:8px}
.perf-l{font-size:9px;font-weight:900;letter-spacing:.5px;color:var(--mut2);min-width:26px}
.perf-bar{flex:1;height:5px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.perf-bar i{display:block;height:100%;border-radius:4px}
.perf-stat b{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;color:var(--txt);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
/* simplified bracket header */
.brk-champ{background:linear-gradient(135deg,rgba(255,214,10,.16),rgba(10,10,12,.6));border:1px solid rgba(255,214,10,.4);border-radius:16px;padding:14px 16px;margin-bottom:12px;text-align:center;cursor:pointer}
.brk-champ .bc-l{font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.brk-champ .bc-t{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:900;letter-spacing:-.5px;margin-top:5px;display:flex;align-items:center;justify-content:center;gap:9px}
.brk-champ .bc-fl{font-size:30px}
.brk-help{font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.5;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px}
.brk-help b{color:var(--txt)}
.brk-acts{display:flex;gap:8px;margin-bottom:14px}
.brk-acts button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--txt);font-size:12.5px;font-weight:800;cursor:pointer}
.brk-acts button:active{transform:scale(.96);border-color:var(--teal)}
/* round selector + vertical guided bracket */
.brk-rounds{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 12px;scrollbar-width:none}
.brk-rounds::-webkit-scrollbar{display:none}
.brk-rpill{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:9px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);cursor:pointer;transition:.14s}
.brk-rpill .brp-t{font-size:12px;font-weight:900;color:var(--mut)}
.brk-rpill .brp-n{font-size:9.5px;font-weight:800;color:var(--mut3);font-variant-numeric:tabular-nums}
.brk-rpill.on{background:var(--grad);border-color:transparent;box-shadow:0 6px 18px -6px rgba(59,130,255,.55);transform:translateY(-1px) scale(1.04)}
.brk-rpill:active{transform:scale(.95)}
.brk-rpill.on .brp-t,.brk-rpill.on .brp-n{color:#fff}
.brk-rpill.done .brp-n{color:var(--green)}
.brk-vert{display:flex;flex-direction:column;gap:10px}
/* fluid cascade: ties slide+fade in, gently staggered, every time the round changes */
.brk-vert .tie,.brk-vert .fcard{width:100%;animation:tieIn .42s var(--spring) both}
.brk-vert>*:nth-child(1){animation-delay:.02s}.brk-vert>*:nth-child(2){animation-delay:.06s}.brk-vert>*:nth-child(3){animation-delay:.1s}.brk-vert>*:nth-child(4){animation-delay:.14s}.brk-vert>*:nth-child(5){animation-delay:.18s}.brk-vert>*:nth-child(6){animation-delay:.22s}.brk-vert>*:nth-child(7){animation-delay:.26s}.brk-vert>*:nth-child(8){animation-delay:.3s}
@keyframes tieIn{0%{opacity:0;transform:translateY(14px) scale(.985)}100%{opacity:1;transform:none}}
.brk-vert .tie{width:100%}
.tslot-crown{margin-left:auto;font-size:16px;flex:none;animation:crownPop .6s var(--spring) both;filter:drop-shadow(0 2px 6px rgba(255,214,10,.5))}
@keyframes crownPop{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
/* projected-champion path: a slow premium sheen sweeping across the card */
.brk-vert .tie.path,.brk-vert .fcard.path{position:relative;overflow:hidden}
.brk-vert .tie.path::after,.brk-vert .fcard.path::after{content:"";position:absolute;top:0;left:-60%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);animation:pathSheen 3.4s var(--ease) infinite;pointer-events:none}
@keyframes pathSheen{0%{left:-60%}55%,100%{left:130%}}
.brk-vert .tslot{padding:11px 14px;font-size:14.5px}
.tslot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tslot-tick{margin-left:auto;color:var(--green);font-size:13px;font-weight:900;flex:none}
.brk-vert .tslot .fl{font-size:19px}
.brk-vert .tslot .nm.ph{font-size:12px}
.brk-vert .mlbl{font-size:9px;padding:5px 11px}
.brk-locked{background:linear-gradient(135deg,rgba(255,159,10,.14),rgba(0,0,0,.4));border:1px solid rgba(255,159,10,.34);border-radius:14px;padding:14px 15px;margin-bottom:6px}
.brk-locked .bl-t{font-size:13.5px;font-weight:900}
.brk-locked .bl-s{font-size:12px;color:var(--mut);font-weight:600;line-height:1.5;margin-top:4px}
.brk-locked .bl-fill{margin-top:11px;width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#ffd60a,#ff9f0a);color:#1a1205;font-size:13.5px;font-weight:900;cursor:pointer}
.brk-locked .bl-fill:active{transform:scale(.98)}
.brk-proj{background:linear-gradient(135deg,rgba(10,132,255,.16),rgba(0,0,0,.35));border:1px solid rgba(10,132,255,.35);border-radius:13px;padding:12px 14px;margin-bottom:6px;font-size:12.5px;color:var(--txt);font-weight:600;line-height:1.5}
.brk-proj b{color:var(--teal2)}
/* bracket mode switcher */
.brk-mode{display:flex;gap:5px;background:rgba(118,118,128,.16);border:1px solid rgba(255,255,255,.05);border-radius:13px;padding:4px;margin-bottom:11px}
.brk-mode button{flex:1;padding:11px 4px;border:none;background:transparent;color:var(--mut);font-size:13px;font-weight:800;border-radius:10px;cursor:pointer;transition:.2s var(--ease)}
.brk-mode button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px -4px rgba(59,130,255,.6)}
.brk-acts .sim-go{background:linear-gradient(135deg,#5e5ce6,#0a84ff);border:none;color:#fff}
.brk-feed{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:11px}
.brk-feed .bf-tx{font-size:11.5px;color:var(--mut);font-weight:600;line-height:1.45;flex:1}
.brk-feed .bf-tx b{color:var(--txt)}
.brk-feed .bf-go{flex-shrink:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--teal2);font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.brk-feed .bf-go:active{transform:scale(.96)}
/* per-tie win probability bar */
.tie-wp{position:relative;height:11px;margin:1px 12px 11px;border-radius:6px;background:rgba(140,152,205,.26);overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.tie-wp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f8fff,#5fb0ff)}
.twp-l,.twp-r{position:absolute;top:0;line-height:11px;font-size:8.5px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.twp-l{left:6px}.twp-r{right:6px}
.tslot-rt{margin-left:auto;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;color:var(--mut2);font-variant-numeric:tabular-nums}
.tslot.win .tslot-rt{color:var(--green)}
/* supercomputer results */
.mc-head{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(94,92,230,.22),rgba(10,132,255,.1));border:1px solid rgba(94,92,230,.4);border-radius:16px;padding:15px;margin-top:12px}
.mc-fav-fl{font-size:42px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.mc-fav-l{font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--teal2)}
.mc-fav-n{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:900;letter-spacing:-.5px;margin-top:1px}
.mc-fav-s{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:3px}
.mc-cols{display:grid;grid-template-columns:22px 26px 1fr 70px 44px 54px;gap:8px;font-size:9px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:var(--mut3);padding:0 0 6px;align-items:center}
.mc-cols span:nth-child(1){grid-column:1/4}.mc-cols span:nth-child(2){text-align:right}.mc-cols span:nth-child(3){text-align:right}
.mc-row{display:grid;grid-template-columns:22px 26px 1fr 70px 44px 54px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.mc-rk{font-size:13px;font-weight:900;color:var(--mut3);text-align:center}
.mc-fl{font-size:19px}.mc-nm{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-bar{height:7px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.mc-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--teal2))}
.mc-v{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:14px;color:var(--gold);text-align:right}
.mc-od{font-size:11px;font-weight:800;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}

.mrow.sweat-winning{border-color:rgba(48,209,88,.6)!important;box-shadow:0 0 20px -5px rgba(48,209,88,.35),inset 0 1px 0 rgba(48,209,88,.2)!important}

.mrow.sweat-tied{border-color:rgba(255,214,10,.5)!important;box-shadow:0 0 20px -5px rgba(255,214,10,.18)!important}

.live-fab .dotlive{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;animation:pulseLive 1.1s infinite}
.live-fab .lf-sc{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
.live-fab .lf-min{font-size:11px;opacity:.9}
/* live stadium weather widget */
.wx-slot:empty{display:none}
.wx{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);font-weight:600;flex-wrap:wrap}
.wx-i{font-size:18px}.wx b{color:var(--txt);font-family:'Space Grotesk',sans-serif;font-size:14px}
.wx-eff{flex-basis:100%;margin-top:4px;font-size:10.5px;color:var(--teal2);font-weight:700}

/* ============================================================
   PREMIUM BROADCAST DESIGN OVERWRITE SYSTEM
   ============================================================ */
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif!important;letter-spacing:-.15px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
h1,.brand,.article-title,.scbig,.hp-prog-pct,.lv-num,.sc-count,.tk-odds,.bh-v{font-family:'Space Grotesk',sans-serif!important;letter-spacing:-1.2px!important;font-weight:900!important}
.sc,.n,.pts,.br-od,.mlo,.co,.scv,.pv,.pr-rat,.bmc-cell .co,.mp-o{font-family:'Space Grotesk',sans-serif!important;font-variant-numeric:tabular-nums!important;font-weight:700!important}
/* abolish the slashed left-borders */
.article-bullet,.story,.gfixrow,.pundit{border-left:none!important;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.01))!important;border:1px solid rgba(255,255,255,.05)!important;border-radius:12px!important;padding:14px 16px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 12px rgba(0,0,0,.2)!important}
/* true media hierarchy — drop loud uppercase labels */
.sub-h,.pr-tier,.tlttl,.dayhd .dw,.hp-prog-l,.news-brand,.bsec{text-transform:none!important;letter-spacing:-.4px!important;font-size:16px!important;font-weight:800!important;color:#fff!important;border-bottom:none!important;padding-bottom:0!important;margin-top:18px!important;margin-bottom:10px!important}
.sub-h::before{top:54%}
/* neon broadcast badges */
.dotlive,.fdot{display:none!important}
.lv-live,.off-badge{background:rgba(255,69,58,.12)!important;border:1px solid rgba(255,69,58,.35)!important;color:#ff453a!important;padding:3px 9px!important;border-radius:6px!important;letter-spacing:-.1px!important;font-weight:800!important;font-size:10px!important;text-transform:uppercase!important}
.off-badge.sim{background:rgba(10,132,255,.12)!important;border:1px solid rgba(10,132,255,.35)!important;color:#0a84ff!important}
/* fluid spatial cards & light control */
.gcard,.ccard,.panel,.newsroom-card,.livev2{background:linear-gradient(165deg,rgba(18,20,26,.82),rgba(8,8,12,.96))!important;border:1px solid rgba(255,255,255,.04)!important;box-shadow:0 24px 48px -12px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07)!important;border-radius:18px!important}
.gcard.god,.tie.path{border-color:rgba(10,132,255,.4)!important;box-shadow:0 0 20px -4px rgba(10,132,255,.25),inset 0 1px 0 rgba(255,255,255,.07)!important}
.hp-prog-bar i{box-shadow:0 0 12px rgba(10,132,255,.4)}
/* ============================================================
   APPLE-SPORTS FEEL · simple · spacious · exquisite · fluid
   (last in the cascade so it sets the final look)
   ============================================================ */
body{background:linear-gradient(180deg,#2a37a0 0%,#1b2670 48%,#10153c 100%) !important;background-attachment:fixed!important;color:#f3f5ff!important}
body::before{background:radial-gradient(95% 50% at 50% -10%,rgba(110,140,255,.30),transparent 60%),radial-gradient(80% 50% at 50% 112%,rgba(8,12,44,.6),transparent 60%)!important}
/* one clean, consistent translucent-navy card for every surface */
.gcard,.ccard,.panel,.newsroom-card,.livev2,.picker,.rhero,.bmc,.kpulse,.lvnow,.th-wrap,.brk-bet,.gproj,.ttc,.promo,.share-box,.installbar,.mc-head{
  background:linear-gradient(168deg,rgba(48,62,132,.52),rgba(28,38,92,.60))!important;

/* bright, confident headings */

/* frosted navy chrome */

/* a11y + scroll polish */
.tabbar button:focus-visible,.seg button:focus-visible,.brk-mode button:focus-visible,.arrows button:focus-visible{outline:2px solid var(--teal2);outline-offset:-3px;border-radius:10px}

function formBonus(code){const g=TG[code];if(!gComplete(g))return 0;const s=standings(g).find(x=>x.code===code);if(!s)return 0;let b=0;if(s.Pts>=7)b+=3;else if(s.Pts<=1)b-=2;if(s.GD>=4)b+=1;else if(s.GD<=-4)b-=1;return b;}
function strength(code){let r=RAT[code]||70;if(HOSTS[code])r+=1;r+=formBonus(code);const cd=condition(code);if(cd<85)r-=(85-cd)*0.14;return r;}
/* Explain WHY a team's live rating has moved off its base — surfaces the dominant
   driver (form / host / fatigue) so rankings feel smart, not arbitrary. */
function rankWhy(code){var form=formBonus(code)||0;var cd=condition(code);var fatigue=cd<85?-(85-cd)*0.14:0;var host=HOSTS[code]?1:0;
 var picks=[];if(form>=0.3)picks.push([form,'📈 hot form']);if(fatigue<=-0.3)picks.push([Math.abs(fatigue),'🥵 leg-weary']);if(host&&form<0.3)picks.push([0.4,'🏟️ host edge']);
 if(!picks.length)return '';picks.sort(function(a,b){return b[0]-a[0];});return picks[0][1];}
function effDiff(h,a){return strength(h)-strength(a);}
function simScore(h,a){var sm=simM();const d=effDiff(h,a)*sm.edge;return{h:poisson(clamp((1.35+d*0.03)*sm.goal,.12,6.5)),a:poisson(clamp((1.35-d*0.03)*sm.goal,.12,6.5))};}
/* Win-the-tie probability from the same Poisson engine: chance of winning in 90'
   plus half the draw mass (a shootout is ~a coin flip). Coherent with koOdds. */
/* A real penalty shootout is near 50/50 with only a faint skill edge. */
function shootoutProb(h,a){return Math.max(.34,Math.min(.66,0.5+effDiff(h,a)*0.006));}
function koProb(h,a){var xg=xgFor(h,a);var pr=oneXtwo(xg[0],xg[1]);return Math.max(.02,Math.min(.98,pr.pH+pr.pD*shootoutProb(h,a)));}
function koPick(h,a){return Math.random()<koProb(h,a)?h:a;}
function mulberry(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function goalMins(num,count,salt){const r=mulberry(num*131+(salt||0)*977+count*7);let a=[];for(let i=0;i<count;i++)a.push(1+Math.floor(r()*90));return a.sort((x,y)=>x-y);}

    "ABCDEFGHIJKL".split("").forEach(function(g){R.order[g]=standings(g).map(function(x){return x.code;});});
    R.thirds=null;
    [[73,88],[89,96],[97,100],[101,102],[103,104]].forEach(function(rg){for(var n=rg[0];n<=rg[1];n++){var p=koParts(n);if(p[0]&&p[1]&&!R.ko[n])R.ko[n]=koPick(p[0],p[1]);}});

/* ---- AUTO-INGEST real finished results ----------------------------------
