name: release-gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Logic + truth suite
        run: npm run test:logic
      - name: Whitespace hygiene
        run: git diff --check

  v2-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: V2 typecheck
        run: npm run typecheck:v2
      - name: V2 foundation smoke tests
        run: npm run test:v2
      - name: V2 production build
        run: npm run build:v2
