name: Release Gate

on:
  push:
  pull_request:

jobs:
  logic-tests:
    name: Node truth tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Install devDependencies from the lockfile WITHOUT downloading browsers.
      # The CI gate runs only the Node truth tests, never Playwright/browser UI.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: Run release logic gate (all .test.js and .test.mjs truth tests)
        run: npm run test:logic
        timeout-minutes: 15
